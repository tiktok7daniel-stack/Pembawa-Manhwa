name: Build Android APK

on:
  push:
    branches: [main, ccr-aac45ad3-i45rtq]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk MangaVault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MangaVault-apk
          path: MangaVault.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MangaVault APK (latest build)
          prerelease: true
          files: MangaVault.apk
          body: "Latest automatic build. Download MangaVault.apk, allow installs from unknown sources, and install."
          target_commitish: ${{ github.sha }}

  e2e:
    # Runs the real app on an Android emulator: parse, download, open the CBZ files, take screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          working-directory: android
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon || echo failed > ../e2e-failed
            mkdir -p ../e2e && adb pull /sdcard/Download/MangaVault/screens ../e2e/ || true
            adb shell ls -lR /sdcard/Download/MangaVault || true
            test ! -f ../e2e-failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
