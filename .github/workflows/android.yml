name: Build Android APK

on:
  push:
    branches: [main, ccr-aac45ad3-i45rtq]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk MangaVault.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MangaVault-apk
          path: MangaVault.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MangaVault APK (latest build)
          prerelease: true
          files: MangaVault.apk
          body: "Latest automatic build. Download MangaVault.apk, allow installs from unknown sources, and install."
          target_commitish: ${{ github.sha }}
